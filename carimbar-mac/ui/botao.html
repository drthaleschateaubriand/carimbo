<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>CARIMBAR</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body id="botao-wrap">
<button class="carimbar" id="btn" type="button">CARIMBAR</button>
<script>
const btn=document.getElementById('btn');
btn.addEventListener('click',function(){ window.carimbar.noBotao('capturar'); });
btn.addEventListener('contextmenu',function(e){ e.preventDefault(); window.carimbar.noBotao('abrir-ajustes'); });
</script>
</body>
</html>
